name: Build WindLab plugins

# CI budget: batch feature changes (normally 3 commits) then mark the draft
# PR "Ready for review" ONCE to compile all formats. Avoid expensive builds
# on every opened/synchronize pull_request event. Keep the final main build.
# For corrections after a failed run: convert PR back to Draft, make grouped
# commits, then mark Ready again. workflow_dispatch remains available in Actions.
on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windlab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 VST3 + Standalone
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Cache recorded CC0 WAV bank
        uses: actions/cache@v6
        with:
          path: Resources/Samples
          key: windlab-cc0-v05-${{ runner.os }}-${{ hashFiles('scripts/download-recordings.py') }}


      - name: Fetch CC0 acoustic samples
        shell: pwsh
        run: python scripts/download-recordings.py

      # Optional: recorded rooms for the convolution reverb (OpenAIR, CC BY 4.0).
      - name: Fetch recorded reverb rooms (optional)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: python scripts/download-rooms.py

      - name: Verify acoustic recordings, velocity layers and staccatos
        shell: pwsh
        run: python tests/validate-recorded-bank.py

      - name: Validate offline user guide and help buttons
        shell: pwsh
        run: python tests/validate-guide.py

      - name: Configure (Visual Studio 2022)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: DSP smoke tests
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "build/WindLab_artefacts/Release/VST3/WindLab.vst3"
          if (-not (Test-Path $source)) { throw "VST3 not found: $source" }
          New-Item -ItemType Directory -Force -Path "dist/VST3" | Out-Null
          Copy-Item $source -Destination "dist/VST3" -Recurse -Force
          Compress-Archive -Path "dist/*" -DestinationPath "WindLab-Windows-x64.zip" -Force

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v7
        with:
          name: WindLab-Windows-x64-VST3
          path: WindLab-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package Standalone EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build/WindLab_artefacts/Release/Standalone/WindLab.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            Get-ChildItem "build/WindLab_artefacts/Release" -Recurse -Filter *.exe | Select-Object -ExpandProperty FullName
            throw "Windows Standalone executable not found: $exe"
          }
          New-Item -ItemType Directory -Force -Path "dist/Standalone" | Out-Null
          Copy-Item $exe -Destination "dist/Standalone/WindLab.exe" -Force
          Compress-Archive -Path "dist/Standalone/*" -DestinationPath "WindLab-Windows-x64-Standalone.zip" -Force
          if (-not (Test-Path "WindLab-Windows-x64-Standalone.zip")) {
            throw "Standalone archive not generated"
          }

      - name: Upload Windows Standalone
        uses: actions/upload-artifact@v7
        with:
          name: WindLab-Windows-x64-Standalone
          path: WindLab-Windows-x64-Standalone.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Apple Silicon AU + VST3
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Empty unless the repository has the Apple signing secrets.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Cache recorded CC0 WAV bank
        uses: actions/cache@v6
        with:
          path: Resources/Samples
          key: windlab-cc0-v05-${{ runner.os }}-${{ hashFiles('scripts/download-recordings.py') }}


      - name: Verify tools and architecture
        shell: bash
        run: |
          uname -m
          xcodebuild -version
          cmake --version

      - name: Fetch CC0 acoustic samples
        shell: bash
        run: python3 scripts/download-recordings.py

      # Optional: recorded rooms for the convolution reverb (OpenAIR, CC BY 4.0).
      - name: Fetch recorded reverb rooms (optional)
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: python3 scripts/download-rooms.py

      - name: Verify acoustic recordings, velocity layers and staccatos
        shell: bash
        run: python3 tests/validate-recorded-bank.py

      - name: Validate offline user guide and help buttons
        shell: bash
        run: python3 tests/validate-guide.py

      - name: Configure (Xcode, arm64)
        shell: bash
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DBUILD_TESTING=ON

      - name: Build Release
        shell: bash
        run: cmake --build build --config Release --parallel 3

      - name: DSP smoke tests
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check Sonoma installer scripts
        shell: bash
        run: |
          bash -n "installers/Installa WindLab.command"
          bash -n scripts/package-macos.sh

      # Optional Developer ID signing + notarization: runs only when the Apple
      # secrets exist (docs/Firma-Apple-Notarizzazione.md). Otherwise ad-hoc as before.
      - name: Import Apple Developer ID certificates
        if: ${{ env.MACOS_CERT_P12 != '' }}
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/windlab-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/windlab-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/windlab-cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/windlab-cert.p12"

      - name: Package signed development bundles, Sonoma PKG and installer ZIP
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/package-macos.sh build/WindLab_artefacts/Release .

      - name: Upload macOS Sonoma installer ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WindLab-macOS-Sonoma-14-arm64-installer
          path: WindLab-macOS-Sonoma-14-arm64.zip
          if-no-files-found: error
          retention-days: 14
